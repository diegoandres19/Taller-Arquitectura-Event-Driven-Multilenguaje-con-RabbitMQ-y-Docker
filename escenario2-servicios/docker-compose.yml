x-rabbit: &rabbit
  RABBITMQ_HOST: "192.168.1.10"
  RABBITMQ_USER: "admin"
  RABBITMQ_PASS: "admin"

services:
  pedidos:
    build: ../servicios/productores/pedidos-python
    container_name: pedidos
    restart: unless-stopped
    environment: *rabbit

  pagos:
    build: ../servicios/productores/pagos-node
    container_name: pagos
    restart: unless-stopped
    environment: *rabbit

  inventario:
    build: ../servicios/productores/inventario-go
    container_name: inventario
    restart: unless-stopped
    environment: *rabbit

  usuarios:
    build: ../servicios/productores/usuarios-java
    container_name: usuarios
    restart: unless-stopped
    environment: *rabbit

  facturacion:
    build: ../servicios/consumidores/facturacion-node
    container_name: facturacion
    restart: unless-stopped
    environment: *rabbit

  notificaciones:
    build: ../servicios/consumidores/notificaciones-python
    container_name: notificaciones
    restart: unless-stopped
    environment: *rabbit

  existencias:
    build: ../servicios/consumidores/existencias-go
    container_name: existencias
    restart: unless-stopped
    environment: *rabbit

  auditoria:
    build: ../servicios/consumidores/auditoria-java
    container_name: auditoria
    restart: unless-stopped
    environment: *rabbit
